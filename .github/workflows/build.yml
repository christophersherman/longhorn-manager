name: build
permissions:
  contents: read
on:
  push:
    branches:
    - master
    - v*
    tags:
    - v*
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    outputs:
      version_major: ${{ steps.build_info.outputs.version_major }}
      version_minor: ${{ steps.build_info.outputs.version_minor }}
      version_patch: ${{ steps.build_info.outputs.version_patch }}
      image_tag: ${{ steps.build_info.outputs.image_tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: b0685d91c8a2f2634f026828a51b13c714b7685a

    - id: build_info
      name: Declare build info
      run: |
        version_major=''
        version_minor=''
        version_patch=''
        image_tag=''

        branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        ref=${{ github.ref }}
        if [[ "$ref" =~ 'refs/tags/' ]]; then
          version=$(sed -E 's/^v([0-9]*\.[0-9]*\.[0-9]*).*$/\1/' <<<${{ github.ref_name }} )
          version_major=$(cut -d. -f1 <<<$version)
          version_minor=$(cut -d. -f2 <<<$version)
          version_patch=$(cut -d. -f3 <<<$version)
          image_tag=${{ github.ref_name }}
        elif [[ "$ref" =~ 'refs/heads/' ]]; then
          image_tag="${branch}-head"
        fi

        echo "version_major=${version_major}" >>$GITHUB_OUTPUT
        echo "version_minor=${version_minor}" >>$GITHUB_OUTPUT
        echo "version_patch=${version_patch}" >>$GITHUB_OUTPUT
        echo "image_tag=${image_tag}" >>$GITHUB_OUTPUT

        cat <<EOF
        version_major=${version_major}
        version_minor=${version_minor}
        version_patch=${version_patch}
        image_tag=${image_tag}
        EOF

    # Build binaries
    - name: Run ci
      run: make ci

    - name: Run test
      run: make test

    - name: Stress retry tests and verify pre-fix failure
      run: |
        docker run --rm -i longhorn-manager-test bash -s <<'SCRIPT'
        set -euo pipefail
        go test -race ./controller -run '^Test$' -count=25 -args -check.f KubernetesNodeController
        git apply --unidiff-zero - <<'PATCH'
        diff --git a/controller/kubernetes_node_controller.go b/controller/kubernetes_node_controller.go
        --- a/controller/kubernetes_node_controller.go
        +++ b/controller/kubernetes_node_controller.go
        @@ -222 +221,0 @@
        -			knc.queue.AddAfter(key, kubernetesNodeCleanupRetryInterval)
        PATCH
        set +e
        go test -race ./controller -run '^Test$' -count=1 -args \
          -check.f 'KubernetesNodeController(RetriesDelayedResourceCleanup|CleanupRetryRechecksKubernetesNode)' \
          2>&1 | tee /tmp/node-gc-before-fix.log
        test_status=${PIPESTATUS[0]}
        set -e
        test "$test_status" -ne 0
        grep -F 'context deadline exceeded' /tmp/node-gc-before-fix.log
        grep -F '2 FAILED' /tmp/node-gc-before-fix.log
        SCRIPT

  build_push_image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: build
    if: ${{ false }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # For multi-platform support
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    # longhornio/longhorn-manager image
    - name: Build and publish image
      env:
        REPO: docker.io/longhornio
        TAG: ${{ needs.build.outputs.image_tag }}
        TARGET_PLATFORMS: linux/amd64,linux/arm64
      run: make workflow-image-build-push
